<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Store - Customer Catalog</title>
    <link rel="stylesheet" href="tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-couch text-xl"></i>
                </div>
                <span class="text-xl font-bold text-gray-900 tracking-tight">Royal Teak</span>
            </div>
            
            <div class="flex items-center gap-4 text-xs font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Live Inventory Sync Active
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="bg-gray-800 text-white py-10 px-6 rounded-lg my-6 mx-6 shadow-md">
        <div class="max-w-7xl mx-auto text-center">
            <h1 class="text-3xl font-extrabold text-white mb-2">Modern Comfort for Every Room</h1>
            <p class="text-gray-300 text-sm max-w-2xl mx-auto">Explore our live RFID-tracked furniture catalog. Real-time availability updated instantly as items are scanned in our warehouse.</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 pb-12 flex-grow w-full">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-gray-900">Available Products</h2>
            <span id="product-count" class="text-xs bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full font-medium">0 Items</span>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Dynamic products will be injected here by main.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500">
        <p>&copy; 2026 Royal Teak Platform. Powered by ESP32 RFID Edge Gateway.</p>
    </footer>

    <!-- Scripts -->
    <script src="main.js"></script>
</body>
</html>
